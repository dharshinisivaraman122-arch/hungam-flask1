<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hangman</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
</head>
<body>
  <div class="scanlines"></div>
  <div class="container">
    <h1 class="title">H A N G M A N</h1>

    <div class="game-grid">
      <!-- Gallows -->
      <div class="gallows-wrap">
        <pre id="gallows" class="gallows"></pre>
        <div id="wrong-counter" class="wrong-counter"></div>
      </div>

      <!-- Right panel -->
      <div class="right-panel">
        <div class="hint-box">
          <span class="label">HINT</span>
          <span id="hint-text"></span>
        </div>

        <div id="word-row" class="word-row"></div>

        <div id="status-msg" class="status-msg"></div>

        <div id="keys" class="keys"></div>

        <button id="new-game-btn" class="new-game-btn" style="display:none">▶ NEW GAME</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
